schema_version: 1
profile:
  name: swag-system-one-default
  description: >
    Default SWAG AIDevSpec for operator-directed development. This profile keeps
    the system grounded in explicit evidence, strong coding standards, and
    runtime-configurable frontier/local model routing.
  owner: operator
  scope:
    repository_roots:
      - .
    include_paths:
      - config/
      - tools/
      - tests/
    exclude_paths:
      - chat-archive/
      - .git/
  default_maturity: growing
  default_model_tier: 14b

operator_preferences:
  coding_style: production_ready
  reasoning_preference: evidence_first
  architecture_bias: explicit_contracts
  testing_policy: mandatory_for_behavior_changes
  security_posture: secure_by_default
  documentation_standard: cite_sources_and_tradeoffs
  rollout_style: staged_and_replayable

quality_gates:
  require_main_question_threshold: true
  min_main_questions: 50
  max_main_questions: 75
  decision_matrix_required: true
  require_model_tier_comparison: true
  require_frontier_or_local_provider_status: true
  require_trace_replay_log: true

llm_targets:
  default_tier: 14b
  preferred_order:
    - 14b
    - 7b
    - 27-28b
  local_fallback_order:
    - qwen2.5-coder-7b-instruct
    - qwen2.5-coder-14b-instruct
    - qwen2.5-coder-32b-instruct
  frontier_fallback_order:
    - openrouter/qwen-2.5-7b-instruct
    - xai/spark-14b
    - xai/spark-27-28b
    - openai/gpt-5-mini
    - anthropic/claude-sonnet-4.6

runtime_policy:
  prefer_local_for: [offline, privacy_sensitive, budget_guardrail]
  prefer_frontier_for: [hard_reasoning, cross_provider_validation, large_context]
  cost_guardrail: enabled
  budget_warning_threshold_usd: 25
  budget_hard_stop_usd: 100
  retries: 2

decision_requirements:
  output_contract: structured_json
  must_include:
    - route_selection
    - provider_plan
    - model_tier
    - decision_matrix
    - trace_summary
  evidence_rules:
    - cite_source_for_non_trivial_assumptions
    - flag_confusion_and_uncertainty
    - dry_run_before_frontier_execution
