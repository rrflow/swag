schema_version: 1
mcp:
  enabled: true
  transport: stdio
  servers:
    - name: swag
      description: SWAG previews and diagnostics; configure absolute installed paths before client registration
      command: python
      args: ["tools/swag_mcp_server.py"]
      env: {}
      enabled: true
      scope: global
    - name: filesystem
      description: File and repo access for project-local tool execution
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
      env: {}
      enabled: true
      scope: project
    - name: github
      description: Optional GitHub integration for PR / issue / repo context
      command: npx
      args: ["-y", "@modelcontextprotocol/server-github"]
      env: {}
      enabled: false
      scope: global
