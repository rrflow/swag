name: Repo status

# Runs from the default branch only. It never checks out or executes pull request code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: repo-status-${{ github.event.workflow_run.id || github.run_id }}

jobs:
  ci-result:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/swag_repo_status.py run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}

  ledger:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/swag_repo_status.py ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
