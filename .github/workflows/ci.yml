name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python tools/check_naming.py --no-user --dry-run
      - run: python tools/check_naming.py --no-user --kind lane_key tests/fixtures/lane_keys.txt
      - run: python tools/boundary_controller.py --pretty --intent-text "secure AI app architecture"

  evidence-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r ../requirements.txt
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source /repo --redact --verbose --no-banner

  ci-gate:
    if: always()
    needs: [python, evidence-viewer, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.python.result }}${{ needs.evidence-viewer.result }}${{ needs.secret-scan.result }}" = successsuccesssuccess
